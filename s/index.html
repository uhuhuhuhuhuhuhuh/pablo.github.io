<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07090d">
  <title>Infinite Corridor Share</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../xl.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="mark">∞</div><div><h1>INFINITE CORRIDOR</h1><small>self-contained share resolver</small></div></div>
    <div class="status">ICS1 LOCAL DECODER</div>
  </header>
  <main>
    <section class="panel active">
      <div id="share-resolver" class="card"><div class="notice">Reading self-contained share…</div></div>
    </section>
  </main>
  <footer>Infinite Corridor · no registry · no file server · local reconstruction</footer>
</div>
<script type="module">
import { decodeIcsToken, formatIcsBytes, inferMime } from '../ics-share-codec.js?v=20260812ics1';

const target = document.querySelector('#share-resolver');
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let objectUrl = null;
let decodedBytes = null;
let decodedFilename = null;

function parseShare() {
  const raw = location.hash.replace(/^#/, '');
  if (!raw) throw new Error('This URL does not contain an ICS1 share token.');
  const slash = raw.lastIndexOf('/');
  if (slash < 0) throw new Error('This share URL is missing its filename.');
  const token = raw.slice(0, slash);
  let filename;
  try { filename = decodeURIComponent(raw.slice(slash + 1)); }
  catch { throw new Error('The filename at the end of this share URL is malformed.'); }
  filename = filename.replace(/[\\/\u0000-\u001f\u007f]/g, '_').trim().slice(0, 255);
  if (!filename) filename = 'corridor-share.bin';
  return { token, filename };
}

function startDownload() {
  if (!decodedBytes || !decodedFilename) return;
  if (!objectUrl) objectUrl = URL.createObjectURL(new Blob([decodedBytes], { type: inferMime(decodedFilename) }));
  const a = document.createElement('a');
  a.href = objectUrl;
  a.download = decodedFilename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function load() {
  const { token, filename } = parseShare();
  document.title = `${filename} · Infinite Corridor`;
  target.innerHTML = `<span class="eyebrow">ICS1 self-contained object</span><h3>${esc(filename)}</h3><div id="decode-status" class="notice" style="margin-top:16px">Decoding the URL payload locally…</div>`;
  await new Promise(requestAnimationFrame);

  const result = await decodeIcsToken(token);
  decodedBytes = result.bytes;
  decodedFilename = filename;

  const mode = result.mode === 'G' ? 'gzip-compressed payload' : 'raw reversible payload';
  target.innerHTML = `<span class="eyebrow">ICS1 self-contained object</span><h3>${esc(filename)}</h3>
    <div class="regex-meta"><span>${esc(formatIcsBytes(result.bytes.length))}</span><span>${esc(mode)}</span><span>SHA-256 verified</span><span>random salt discarded</span></div>
    <div class="notice" style="margin-top:16px">The original bytes were reconstructed entirely from this URL. GitHub Pages did not receive the fragment payload and no pointer database was queried.</div>
    <div class="button-row"><button id="download-share">Download ${esc(filename)}</button><a href="../"><button class="secondary">Open Infinite Corridor</button></a></div>
    <div class="muted" style="margin-top:10px">Automatic download will be attempted once. If your browser blocks it, use the Download button.</div>`;

  document.querySelector('#download-share').onclick = startDownload;
  setTimeout(startDownload, 250);
}

load().catch(error => {
  target.innerHTML = `<div class="notice error"><strong>Could not reconstruct this share.</strong><br>${esc(error.message || error)}</div><div class="button-row"><a href="../"><button class="secondary">Open Infinite Corridor</button></a></div>`;
});

addEventListener('beforeunload', () => {
  if (objectUrl) URL.revokeObjectURL(objectUrl);
});
</script>
</body>
</html>
